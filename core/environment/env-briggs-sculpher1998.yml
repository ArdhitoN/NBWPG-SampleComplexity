# Disease Progression Model — Briggs & Sculpher (1998)
#
# Reference: Briggs, A. & Sculpher, M. (1998). An introduction to Markov modelling
#            for economic evaluation. Pharmacoeconomics, 13(4), 397-409.
#
# States:
#   s0 — Asymptomatic disease  (TRANSIENT)
#   s1 — Progressive disease   (TRANSIENT)
#   s2 — Death / Mortality     (RECURRENT, absorbing)
#
# s0 and s1 are transient: every trajectory is eventually absorbed into s2.
# Gain = 0 for ALL policies (absorbing s2 with reward 0).
# Policies are distinguished solely by BIAS = expected total QALYs (Quality-Adjusted Life Years) before death.
#
# Actions (s0, s1): 0 = no treatment, 1 = treatment
#   Treatment slows disease progression but incurs a QALY utility penalty.
# Actions (s2): both self-loop; no meaningful decision in the absorbing state.
#
# Bias values (h(s0)) across all 4 deterministic policies:
#   pi(no-treat, no-treat):  5.95   <- worst
#   pi(no-treat, treat-s1):  6.48
#   pi(treat-s0, no-treat):  9.32
#   pi(treat-s0, treat-s1):  9.82   <- bias-optimal
#
# Transition probabilities and QALY utilities inspired by the HIV/AIDS
# disease progression model described in Briggs & Sculpher (1998).

transitions:
  s0:
    a00:
      - { "next_state": "s0", "reward": 1.0, "prob": 0.79 }
      - { "next_state": "s1", "reward": 1.0, "prob": 0.20 }
      - { "next_state": "s2", "reward": 1.0, "prob": 0.01 }
    a01:
      - { "next_state": "s0", "reward": 0.9, "prob": 0.89 }
      - { "next_state": "s1", "reward": 0.9, "prob": 0.10 }
      - { "next_state": "s2", "reward": 0.9, "prob": 0.01 }
  s1:
    a10:
      - { "next_state": "s1", "reward": 0.5, "prob": 0.60 }
      - { "next_state": "s2", "reward": 0.5, "prob": 0.40 }
    a11:
      - { "next_state": "s1", "reward": 0.45, "prob": 0.75 }
      - { "next_state": "s2", "reward": 0.45, "prob": 0.25 }
  s2:
    a20: { "next_state": "s2", "reward": 0.0, "prob": 1.0 }
    a21: { "next_state": "s2", "reward": 0.0, "prob": 1.0 }

transitions_converted:
  # Index at each level consecutively: current state, action, next state
  0:
    0:
      0: { "prob": 0.79, "reward": 1.0 }
      1: { "prob": 0.20, "reward": 1.0 }
      2: { "prob": 0.01, "reward": 1.0 }
    1:
      0: { "prob": 0.89, "reward": 0.9 }
      1: { "prob": 0.10, "reward": 0.9 }
      2: { "prob": 0.01, "reward": 0.9 }
  1:
    0:
      1: { "prob": 0.60, "reward": 0.5 }
      2: { "prob": 0.40, "reward": 0.5 }
    1:
      1: { "prob": 0.75, "reward": 0.45 }
      2: { "prob": 0.25, "reward": 0.45 }
  2:
    0:
      2: { "prob": 1.0, "reward": 0.0 }
    1:
      2: { "prob": 1.0, "reward": 0.0 }

initial_state: "s0"
initial_state_dist: { 0: 1.0 }
